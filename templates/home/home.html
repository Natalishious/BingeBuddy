{% extends "layout.html" %}

{% block content %}

<div class="home-page" style="background-image: url('{{ recently['poster'] }}');">

    <div class="home-overlay">

        <section class="home-hero">

            <p class="welcome-text">Welcome to BingeBuddy</p>

            <a href="{{ url_for('home') }}" class="hero-label">
                Discover Something New
            </a>

            <h1>{{ recently['title'] }}</h1>

            <p class="hero-synopsis">
                {{ recently['overview'][:180] }}...
            </p>

            <div class="hero-tags">
                <span>{{ recently['genres'] }}</span>
                <span>Rating: {{ recently['rating'] }}</span>
            </div>

        </section>

    </div>

</div>

{% endblock %}
